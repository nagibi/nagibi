name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: projects/ibigan-web/package-lock.json

      - name: Install frontend dependencies
        run: npm install --force
        working-directory: projects/ibigan-web

      - name: Build frontend
        run: |
          cat > .env.production << 'EOF'
          VITE_API_URL=https://nagibi.com.br/api
          VITE_APP_NAME=nagibi
          VITE_REVERB_APP_KEY=xu6y2ryaemtltwri5ulq
          VITE_REVERB_HOST=nagibi.com.br
          VITE_REVERB_PORT=443
          VITE_REVERB_SCHEME=https
          EOF
          npm run build
        working-directory: projects/ibigan-web

      - name: Validate deploy secrets
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SERVER_IP" ]; then
            echo "::error::Missing GitHub Actions secret SERVER_IP (host/IP do servidor de produção)."
            exit 1
          fi

          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Missing GitHub Actions secret SSH_PRIVATE_KEY (chave privada SSH para deploy)."
            exit 1
          fi

      - name: Setup SSH
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if ! ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub 2>/dev/null; then
            echo "::error::SSH_PRIVATE_KEY inválida. Cole a chave completa, incluindo BEGIN/END, sem senha."
            exit 1
          fi

          echo "Fingerprint da chave de deploy (confira no servidor):"
          ssh-keygen -lf ~/.ssh/deploy_key.pub

          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH connection
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            root@"$SERVER_IP" "echo SSH OK"

      - name: Sync files to server
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='projects/ibigan-api/vendor' \
            --exclude='projects/ibigan-api/node_modules' \
            --exclude='projects/ibigan-api/storage/logs' \
            --exclude='projects/ibigan-api/.env' \
            --exclude='projects/ibigan-web/node_modules' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=no" \
            ./ root@"$SERVER_IP":/opt/nagibi/

      - name: Deploy on server
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            root@"$SERVER_IP" << 'EOF'
            set -e
            chmod +x /opt/nagibi/scripts/deploy-prod.sh
            /opt/nagibi/scripts/deploy-prod.sh
          EOF
