name: nagibi

services:

  # ── PHP-FPM — Laravel 12 / PHP 8.4 ───────────────────────────
  app:
    build:
      context: ./docker/php
      args:
        USER_ID: 1000
        GROUP_ID: 1000
        INSTALL_XDEBUG: 0
    container_name: nagibi_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
    volumes:
      - ./projects/ibigan-api:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    networks:
      - nagibi_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Nginx ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: nagibi_nginx
    restart: unless-stopped
    environment:
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
    ports:
      - "127.0.0.1:${NGINX_HTTP_PORT:-8081}:80"
      - "127.0.0.1:${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ./projects/ibigan-api:/var/www
      - ./projects/ibigan-web/dist:/var/www/spa
      - ./docker/nginx/conf.d/production.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - nagibi_network
    depends_on:
      - app
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── MySQL 8.4 ─────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: nagibi_mysql
    restart: unless-stopped
    environment:
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nagibi_central}
      MYSQL_USER: ${MYSQL_USER:-nagibi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: ["mysqld", "--default-time-zone=-03:00"]
    volumes:
      - nagibi_mysql_data:/var/lib/mysql
      - ./docker/mysql/init-prod.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - nagibi_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Redis 7 ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nagibi_redis
    restart: unless-stopped
    volumes:
      - nagibi_redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - nagibi_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Horizon ───────────────────────────────────────────────────
  horizon:
    build:
      context: ./docker/php
      args:
        USER_ID: 1000
        GROUP_ID: 1000
        INSTALL_XDEBUG: 0
    container_name: nagibi_horizon
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
    volumes:
      - ./projects/ibigan-api:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    networks:
      - nagibi_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: php artisan horizon

  # ── Scheduler ─────────────────────────────────────────────────
  scheduler:
    build:
      context: ./docker/php
      args:
        USER_ID: 1000
        GROUP_ID: 1000
        INSTALL_XDEBUG: 0
    container_name: nagibi_scheduler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
    volumes:
      - ./projects/ibigan-api:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    networks:
      - nagibi_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: php artisan schedule:work

  # ── Reverb (WebSockets) ───────────────────────────────────────
  reverb:
    build:
      context: ./docker/php
      args:
        USER_ID: 1000
        GROUP_ID: 1000
        INSTALL_XDEBUG: 0
    container_name: nagibi_reverb
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
    ports:
      - "127.0.0.1:${REVERB_HOST_PORT:-8083}:8080"
    volumes:
      - ./projects/ibigan-api:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    networks:
      - nagibi_network
    depends_on:
      - redis
    command: php artisan reverb:start --host=0.0.0.0 --port=8080

networks:
  nagibi_network:
    name: nagibi_network
    driver: bridge

volumes:
  nagibi_mysql_data:
    name: nagibi_mysql_data
  nagibi_redis_data:
    name: nagibi_redis_data
