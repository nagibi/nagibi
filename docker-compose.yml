name: nagibi

services:
  app:
    build:
      context: ./docker/php
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
        INSTALL_XDEBUG: ${INSTALL_XDEBUG:-0}
    container_name: nagibi_app
    restart: unless-stopped
    environment:
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
    volumes:
      - ./projects/ibigan-api:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    networks:
      - nagibi_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:1.27-alpine
    container_name: nagibi_nginx
    restart: unless-stopped
    environment:
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
    ports:
      - "${NGINX_HTTP_PORT:-8081}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ./projects/ibigan-api:/var/www:ro
      - ./docker/nginx/conf.d/local.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - nagibi_network
    depends_on:
      - app
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mysql:
    image: mysql:8.4
    container_name: nagibi_mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    environment:
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nagibi_central}
      MYSQL_USER: ${MYSQL_USER:-nagibi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nagibi}
    command: ["mysqld", "--default-time-zone=-03:00"]
    volumes:
      - nagibi_mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - nagibi_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: nagibi_redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - nagibi_redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - nagibi_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  horizon:
    build:
      context: ./docker/php
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
        INSTALL_XDEBUG: 0
    container_name: nagibi_horizon
    restart: unless-stopped
    environment:
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
    volumes:
      - ./projects/ibigan-api:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    networks:
      - nagibi_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: php artisan horizon

  scheduler:
    build:
      context: ./docker/php
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
        INSTALL_XDEBUG: 0
    container_name: nagibi_scheduler
    restart: unless-stopped
    environment:
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
    volumes:
      - ./projects/ibigan-api:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    networks:
      - nagibi_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: php artisan schedule:work

  reverb:
    build:
      context: ./docker/php
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
        INSTALL_XDEBUG: 0
    container_name: nagibi_reverb
    restart: unless-stopped
    environment:
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
    ports:
      - "${REVERB_PORT:-8083}:8080"
    volumes:
      - ./projects/ibigan-api:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    networks:
      - nagibi_network
    depends_on:
      - redis
    command: php artisan reverb:start --host=0.0.0.0 --port=8080

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: nagibi_meilisearch
    restart: unless-stopped
    networks:
      - nagibi_network
    environment:
      MEILI_MASTER_KEY: masterKey
      MEILI_ENV: development
      MEILI_EXPERIMENTAL_ENABLE_METRICS: "true"
    volumes:
      - nagibi_meili_data:/meili_data
    ports:
      - "${MEILISEARCH_PORT:-7701}:7700"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: nagibi_prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - nagibi_prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    networks:
      - nagibi_network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: nagibi_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - nagibi_grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    networks:
      - nagibi_network
    depends_on:
      - prometheus

  mysql_exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: nagibi_mysql_exporter
    restart: unless-stopped
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    command:
      - "--mysqld.address=mysql:3306"
      - "--mysqld.username=root"
    ports:
      - "${MYSQL_EXPORTER_PORT:-9105}:9104"
    networks:
      - nagibi_network
    depends_on:
      mysql:
        condition: service_healthy

  redis_exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: nagibi_redis_exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
    ports:
      - "${REDIS_EXPORTER_PORT:-9122}:9121"
    networks:
      - nagibi_network
    depends_on:
      - redis

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: nagibi_cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "${CADVISOR_PORT:-8086}:8080"
    networks:
      - nagibi_network

  vite:
    build: ./docker/vite
    container_name: nagibi_vite
    restart: unless-stopped
    environment:
      VITE_DEV_API_PROXY: http://nginx:80
      VITE_HMR_CLIENT_PORT: ${NGINX_HTTP_PORT:-80}
    ports:
      - "${VITE_PORT:-5174}:5173"
    volumes:
      - ./projects/ibigan-web:/usr/src/app
      - nagibi_vite_node_modules:/usr/src/app/node_modules
    networks:
      - nagibi_network
    command: sh -c "npm install --force && npm run dev -- --host 0.0.0.0 --port 5173"

  mailpit:
    image: axllent/mailpit:latest
    container_name: nagibi_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8026}:8025"
      - "${MAILPIT_SMTP_PORT:-1026}:1025"
    networks:
      - nagibi_network

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: nagibi_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8084}:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      UPLOAD_LIMIT: 300M
    networks:
      - nagibi_network
    depends_on:
      mysql:
        condition: service_healthy

networks:
  nagibi_network:
    driver: bridge

volumes:
  nagibi_mysql_data:
  nagibi_redis_data:
  nagibi_vite_node_modules:
  nagibi_meili_data:
  nagibi_prometheus_data:
  nagibi_grafana_data: